name: Test

# Branch flow: feature branches squash-merge into dev; dev merge-commits into
# main (production); release tags are cut from main. See CONTRIBUTING.md.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  source-branch:
    # A required check on both dev and main: only dev, from this repository,
    # may be merged into main. It passes for every other event.
    name: PR source branch
    runs-on: ubuntu-22.04
    steps:
      - name: Only dev may merge into main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into main must come from $GITHUB_REPOSITORY:dev (got $HEAD_REPO:$HEAD_REF). Target dev instead."
            exit 1
          fi
          echo "Source branch is dev."

  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15-intel
          - macos-15
          - windows-latest
          - windows-11-arm
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Offline behavior tests plus compiled CLI and packaged-install smoke.
      # `pretest` compiles triz.ts to dist/triz.js before the suite runs.
      - run: npm test
      - run: npm run build
