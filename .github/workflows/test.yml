name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15-intel
          - macos-15
          - windows-latest
          - windows-11-arm
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Offline behavior tests plus compiled CLI and packaged-install smoke.
      # `pretest` compiles triz.ts to dist/triz.js before the suite runs.
      - run: npm test
      - run: npm run build
