name: Test
on:
  workflow_call:

permissions:
  contents: read
jobs:
  source-branch:
    name: PR source branch
    runs-on: ubuntu-22.04
    steps:
    - name: Only dev may merge into main
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      env:
        HEAD_REF: ${{ github.head_ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: "if [ \"$HEAD_REF\" != \"dev\" ] || [ \"$HEAD_REPO\" != \"$GITHUB_REPOSITORY\" ]; then\n  echo \"::error::Pull\
        \ requests into main must come from $GITHUB_REPOSITORY:dev (got $HEAD_REPO:$HEAD_REF). Target dev instead.\"\
        \n  exit 1\nfi\necho \"Source branch is dev.\"\n"
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404'
      || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-22.04
        - ubuntu-22.04-arm
        - macos-15-intel
        - macos-15
        - windows-latest
        - windows-11-arm
        node:
        - 24
        - 26
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: npm
    - run: npm ci
    - run: npm test
    - run: npm run build
